# nginx template: ${BACKEND_URL} is filled in when the container starts (official nginx image envsubst).
#   local (docker compose): BACKEND_URL=http://backend:8000
#   Azure Container Apps:   BACKEND_URL=https://<api-app>.internal.<environment-domain>
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Source uploads: no size limit here (0 = unlimited). Set MAX_UPLOAD_MB in the backend to cap them.
    client_max_body_size 0;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass ${BACKEND_URL};
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_read_timeout 3600s;  # very large repository uploads
        proxy_send_timeout 3600s;
        proxy_request_buffering off;  # stream large uploads straight to the backend
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
